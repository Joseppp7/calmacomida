<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CalmaComida</title>

  <link rel="icon" href="./favicon.ico" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1f3b34" />

  <link rel="stylesheet" href="./styles.css?v=1005" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1 id="appTitle">CalmaComida</h1>
        <p class="subtitle" id="appSubtitle">Cargando...</p>
      </div>
      <button class="chip" id="btnReset">Reset</button>
    </header>

    <main class="screen" id="screen">
      <div style="padding:20px; text-align:center;">Cargando tu sesión de calma...</div>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-tab="home">🏠 Inicio</button>
      <button class="tab" data-tab="modules">📚 Módulos</button>
      <button class="tab" data-tab="audio">🆘 Ayuda</button>
      <button class="tab" data-tab="progress">🌱 Progreso</button>
    </nav>
  </div>

  <!-- CARGA EN ORDEN ESTRICTO -->
  <script src="data.js?v=FINAL_FIX"></script>
  <script>
    // Comprobación de seguridad inmediata
    if (!window.APP_DATA) {
      console.error("Fallo crítico: data.js no definió APP_DATA");
      document.getElementById('screen').innerHTML = '<div style="color:red;padding:20px">Error de conexión con los datos. Por favor, recarga la página.</div>';
    }
  </script>
  <script src="./app.js?v=9999"></script>
</body>
</html>
